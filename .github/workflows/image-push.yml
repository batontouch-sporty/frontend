name: Image Push

# main에 머지되면 배포용 이미지를 Docker Hub에 올린다. 계정 설정이 없으면 건너뛴다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 커밋마다 따로 실행해 대기 중인 실행이 취소되지 않게 한다(커밋별 <sha7> 이미지 보존).
# latest는 맨 아래 latest job에서 따로 한 줄로 세워 갱신한다.
concurrency:
  group: image-push-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  push:
    name: 이미지 빌드 · push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}

    steps:
      - name: Docker Hub 설정 확인
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ] || [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::notice::DOCKERHUB_USERNAME·DOCKERHUB_TOKEN secrets 또는 DOCKERHUB_NAMESPACE vars가 없어 이미지 push를 건너뜁니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.check.outputs.enabled == 'true'

      - name: 태그 계산
        if: steps.check.outputs.enabled == 'true'
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.check.outputs.enabled == 'true'

      - name: Docker Hub 로그인
        if: steps.check.outputs.enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 여기서는 <sha7>만 올린다. latest는 아래 latest job이 갱신한다.
      - name: 빌드 · push
        if: steps.check.outputs.enabled == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ vars.DOCKERHUB_NAMESPACE }}/sporty-frontend:${{ steps.tag.outputs.sha }}

  # latest는 main에서만, 커밋 실행들을 한 줄로 세워 갱신한다. 취소하지 않고 순서대로 돌리되 각자 붙이기 직전에 main 최신인지 확인하므로,
  # 늦게 끝난 이전 커밋이 최신 커밋의 갱신을 막거나 덮어쓰지 못한다.
  # 다시 빌드하지 않고 이미 올린 <sha7> 이미지에 latest 태그만 붙이며, 붙이기 직전에 이 커밋이 main 최신인지 확인한다.
  latest:
    name: latest 태그 갱신
    needs: push
    if: github.ref == 'refs/heads/main' && needs.push.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: image-latest-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Docker Hub 로그인
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: main 최신 커밋일 때만 latest 태그
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          # 조회 실패는 건너뛰지 않고 job을 실패시킨다.
          head="$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)"
          [ -n "$head" ] || { echo "::error::main HEAD 조회 실패"; exit 1; }
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main이 ${head::7}로 앞서 있어 latest를 갱신하지 않습니다."
            exit 0
          fi
          docker buildx imagetools create -t "$NAMESPACE/sporty-frontend:latest" "$NAMESPACE/sporty-frontend:${GITHUB_SHA::7}"
