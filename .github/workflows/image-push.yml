name: Image Push

# main에 머지되면 배포용 이미지를 Docker Hub에 올린다. 계정 설정이 없으면 건너뛴다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-push-${{ github.ref }}
  # 진행 중인 빌드는 끝까지 올려 커밋별 <sha7> 이미지를 남기고, latest 갱신 순서를 지킨다.
  cancel-in-progress: false

jobs:
  push:
    name: 이미지 빌드 · push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Docker Hub 설정 확인
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ] || [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::notice::DOCKERHUB_USERNAME·DOCKERHUB_TOKEN secrets 또는 DOCKERHUB_NAMESPACE vars가 없어 이미지 push를 건너뜁니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.check.outputs.enabled == 'true'

      - name: 태그 계산
        if: steps.check.outputs.enabled == 'true'
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.check.outputs.enabled == 'true'

      - name: Docker Hub 로그인
        if: steps.check.outputs.enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest는 main에서만 올린다. 다른 브랜치 수동 실행은 <sha7>만 올린다.
      - name: 빌드 · push
        if: steps.check.outputs.enabled == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/sporty-frontend:${{ steps.tag.outputs.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/sporty-frontend:latest', vars.DOCKERHUB_NAMESPACE) || '' }}
