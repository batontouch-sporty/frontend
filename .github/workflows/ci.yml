name: CI

# PR마다 프론트엔드를 설치·테스트·빌드한다. 백엔드 없이 돌아야 하므로 API는 호출하지 않는다.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 테스트 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 테스트
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: 'true'

      - name: 빌드
        # CRA는 CI=true면 ESLint 경고도 실패로 본다. 경고는 리뷰에서 다루고 빌드는 오류만 막는다.
        run: npm run build
        env:
          CI: 'false'
          REACT_APP_BACKEND_ENDPOINT: http://localhost:8000

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 3
